# Render free web services sleep after 15 idle minutes. When the repository variable
# HOLLABACK_SERVER_URL is set (https://<server>.onrender.com), ping /health so the
# hosted demo answers immediately. Does nothing when the variable is unset.
name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: ${{ vars.HOLLABACK_SERVER_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the Hollaback server
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.HOLLABACK_SERVER_URL }}/health"
